workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: phamijam_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: phamishan.phamijam
      groups:
        - phamijam_env
      vars:
        PROJECT_DIR: PhamiJam-Mobile/phamijam
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Write .env for flutter_dotenv
        script: |
          cd "$PROJECT_DIR"
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env

      - name: Write firebase_options.dart (kept out of git)
        script: |
          cd "$PROJECT_DIR"
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Get Flutter packages
        script: |
          cd "$PROJECT_DIR"
          flutter packages pub get

      - name: Set up code signing
        script: |
          cd "$PROJECT_DIR"
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          cd "$PROJECT_DIR"
          find . -maxdepth 2 -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa
        script: |
          cd "$PROJECT_DIR"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - PhamiJam-Mobile/phamijam/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
