workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The name you give the App Store Connect API key integration when you
      # add it under Codemagic → Teams → Integrations → App Store Connect.
      app_store_connect: phamijam_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: phamishan.phamijam
      groups:
        # Create this group in Codemagic → your app → Environment variables,
        # and add CLIENT_ID, CLIENT_SECRET, and FIREBASE_OPTIONS_DART_B64 to
        # it (mark FIREBASE_OPTIONS_DART_B64 as secure).
        - phamijam_env
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Write .env for flutter_dotenv
        script: |
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env

      - name: Write firebase_options.dart (kept out of git)
        script: |
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Get Flutter packages
        script: flutter packages pub get

      # Auto-fetches/creates the distribution certificate + provisioning
      # profile via the App Store Connect integration above — no manual
      # certificate wrangling needed.
      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: find . -maxdepth 2 -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Matches whatever internal testing group name you create in
        # App Store Connect → TestFlight → Internal Testing.
        beta_groups:
          - "Internal Testers"
