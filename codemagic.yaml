workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: phamijam_asc

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      vars:
        PROJECT_DIR: PhamiJam-Mobile/phamijam

      groups:
        - phamijam_env

      ios_signing:
        distribution_type: app_store
        bundle_identifier: phamishan.phamijam

    scripts:
      - name: Write .env
        script: |
          cd "$PROJECT_DIR"
          cat > .env <<EOF
          CLIENT_ID=$CLIENT_ID
          CLIENT_SECRET=$CLIENT_SECRET
          EOF

      - name: Restore firebase_options.dart
        script: |
          cd "$PROJECT_DIR"
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Flutter pub get
        script: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd "$PROJECT_DIR/ios"
          pod install

      - name: Apply provisioning profiles
        script: |
          cd "$PROJECT_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd "$PROJECT_DIR"
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - PhamiJam-Mobile/phamijam/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
